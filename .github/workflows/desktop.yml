name: Desktop packages (unsigned experimental)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full monorepo main SHA with successful app CI'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && inputs.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s apps/wb/desktop/test -p 'test_*.py'
      - name: Stage exact tested offline builds
        env:
          SUITE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.WISPLAB_ARTIFACT_TOKEN || github.token }}
        run: python3 apps/wb/desktop/scripts/stage.py ci --sha "$SUITE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-offline-resources
          path: apps/wb/desktop/resources/
          if-no-files-found: error
          retention-days: 30

  package:
    needs: stage
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/wb/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wb/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: desktop-offline-resources
          path: apps/wb/desktop/resources/
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
        env:
          DEBUG: pw:browser
      - name: Package unsigned experimental app
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - run: npm run test:packaged
        env:
          DEBUG: pw:browser
      - run: npm run checksums
      - name: Retain installers and exact source manifest
        uses: actions/upload-artifact@v4
        with:
          name: WispLab-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: |
            apps/wb/desktop/out/*.dmg
            apps/wb/desktop/out/*.zip
            apps/wb/desktop/out/*.exe
            apps/wb/desktop/out/*.blockmap
            apps/wb/desktop/out/SHASUMS256.txt
            apps/wb/desktop/resources/release.json
            apps/wb/desktop/reports/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/wb/desktop/reports/
          if-no-files-found: warn
          retention-days: 14
